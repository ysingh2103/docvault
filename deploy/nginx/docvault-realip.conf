# Place in /etc/nginx/conf.d/ (loaded in the http context), then: sudo nginx -t && sudo systemctl reload nginx
# Why: requests through Windows arrive at NGINX from IIS (192.168.49.214), so every log line would show IIS.
# IIS puts the real browser address in X-Forwarded-For. NGINX may believe that header ONLY when the
# connection comes from IIS. From anyone else the header is ignored, so a visitor cannot fake an address.
set_real_ip_from 192.168.49.214;     # IIS on WINWEB01
real_ip_header   X-Forwarded-For;
real_ip_recursive off;
