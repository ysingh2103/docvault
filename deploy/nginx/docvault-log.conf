# Place in /etc/nginx/conf.d/ (this file is loaded in the http context).
# One line per request: the request id, NGINX's total time, and how long Tomcat took to answer.
log_format docvault_rid '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                        'rid=$request_id nginx_s=$request_time upstream_s=$upstream_response_time';
