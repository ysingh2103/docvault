
server {
    listen 8081;
    server_name YOUR_SERVER_IP;
    client_max_body_size 25m;

    location /supportdesk/ {
        proxy_pass http://localhost:8080/supportdesk/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docvault/ {
        proxy_pass http://localhost:8080/docvault/;
        proxy_set_header Host $http_host;
        # Request id: sent to Tomcat, returned to the browser, and written to our own access log.
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;   # keep only NGINX's copy; it also exists when Tomcat is down
        add_header X-Request-ID $request_id always;
        access_log /var/log/nginx/docvault_access.log docvault_rid;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
