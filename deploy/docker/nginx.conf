log_format docvault_rid '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                        'rid=$request_id nginx_s=$request_time upstream_s=$upstream_response_time';
server {
    listen 8081;
    client_max_body_size 25m;
    location /docvault/ {
        proxy_pass http://localhost:8080/docvault/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;
        access_log /dev/stdout docvault_rid;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
