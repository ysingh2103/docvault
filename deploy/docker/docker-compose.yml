# DocVault in containers: PostgreSQL + Tomcat + NGINX.
# NGINX shares Tomcat's network namespace, so Tomcat sees NGINX as 127.0.0.1,
# exactly like on the Linux VM (the app trusts X-Real-IP only from loopback).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    command: ["sh", "-c", "CATALINA_OPTS=\"-Ddb.password=$$DB_PASSWORD\" exec catalina.sh run"]
    volumes:
      - docfiles:/var/lib/docvault/files
    ports:
      - "8081:8081"
  nginx:
    image: nginx:1.27
    network_mode: "service:app"
    depends_on: [app]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  pgdata:
  docfiles:
